[package]
name = "giwifi"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
tokio = { version = "1.53.1", features = ["full"] }
clap = { version = "4.6.6", features = ["derive", "env"] }

aes = "0.9.2"
base64 = "0.23.1"
cbc = { version = "0.2.1", features = ["alloc"] }
ecb = "0.2.1"

url = "2.5.8"
scraper = { version = "0.27.0" }
reqwest = { version = "0.13.4", features = [
    "json",
    'form',
], default-features = false }


serde = { version = "1.0.229", features = ["derive"] }
serde_urlencoded = "0.7.1"
urlencoding = "2.1.3"
# chrono = "0.4.44"
md5 = "0.8.1"
hex = "0.4.3"
serde_json = "1.0.151"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
